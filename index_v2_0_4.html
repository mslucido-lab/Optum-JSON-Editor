<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pricing Editor v2.0.4</title>
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --surface2: #1c2333;
  --surface3: #21262d;
  --border: #30363d;
  --border2: #3d444d;
  --amber: #d29922;
  --amber-dim: #2a2010;
  --green: #3fb950;
  --green-dim: #0a2010;
  --red: #f85149;
  --red-dim: #2a0f0d;
  --blue: #4493f8;
  --blue-dim: #0d1e35;
  --teal: #39c5cf;
  --text: #e6edf3;
  --text2: #8b949e;
  --text3: #484f58;
  --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  --sans: Inter, Segoe UI, Arial, sans-serif;
  --topbar-h: 46px;
  --statusbar-h: 28px;
  --nav-w: 205px;
  --preview-w: 390px;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 13px; display: flex; flex-direction: column; }
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
.topbar { height: var(--topbar-h); background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; padding: 0 14px; flex-shrink: 0; }
.logo { font-family: var(--mono); color: var(--amber); font-size: 12px; font-weight: 700; letter-spacing: .08em; padding-right: 12px; border-right: 1px solid var(--border); white-space: nowrap; }
.file-pill { display: flex; align-items: center; gap: 7px; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; color: var(--text2); font-family: var(--mono); font-size: 11px; min-width: 240px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex: 0 0 auto; }
.dot.dirty { background: var(--amber); }
.spacer { flex: 1; }
.btn { border: 1px solid var(--border); border-radius: 6px; background: transparent; color: var(--text2); padding: 6px 11px; font-size: 12px; }
.btn:hover { border-color: var(--border2); color: var(--text); }
.btn.primary { background: var(--amber); color: #0d1117; border-color: var(--amber); font-weight: 700; }
.btn.green { color: var(--green); border-color: rgba(63,185,80,.45); }
.btn.red { color: var(--red); border-color: rgba(248,81,73,.45); }
.btn.blue { color: var(--blue); border-color: rgba(68,147,248,.45); }
.validation-pill { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10px; padding: 4px 9px; border-radius: 5px; color: var(--green); background: var(--green-dim); border: 1px solid rgba(63,185,80,.35); }
.validation-pill.warn { color: var(--red); background: var(--red-dim); border-color: rgba(248,81,73,.35); }
.main { flex: 1; min-height: 0; display: flex; overflow: hidden; }
.nav { width: var(--nav-w); background: var(--surface); border-right: 1px solid var(--border); padding: 10px 0; overflow-y: auto; flex: 0 0 auto; }
.nav-label { font-family: var(--mono); font-size: 9px; font-weight: 700; color: var(--text3); letter-spacing: .14em; text-transform: uppercase; padding: 10px 14px 4px; }
.nav-item { display: flex; align-items: center; gap: 9px; padding: 8px 14px; color: var(--text2); border-left: 2px solid transparent; user-select: none; }
.nav-item:hover { background: var(--surface2); color: var(--text); }
.nav-item.active { background: var(--surface2); color: var(--amber); border-left-color: var(--amber); }
.nav-icon { width: 16px; text-align: center; opacity: .8; }
.nav-badge { margin-left: auto; font-family: var(--mono); font-size: 9px; color: var(--text3); border: 1px solid var(--border); border-radius: 9px; padding: 1px 6px; }
.nav-divider { height: 1px; background: var(--border); margin: 8px 0; }
.editor { flex: 1; min-width: 0; overflow-y: auto; padding: 22px 24px; }
.preview { width: var(--preview-w); background: var(--surface); border-left: 1px solid var(--border); flex: 0 0 auto; display: flex; flex-direction: column; overflow: hidden; }
.preview-tabs { display: flex; background: var(--surface2); border-bottom: 1px solid var(--border); }
.preview-tab { padding: 9px 14px; color: var(--text2); border-bottom: 2px solid transparent; user-select: none; }
.preview-tab.active { color: var(--blue); border-bottom-color: var(--blue); }
.preview-body { flex: 1; min-height: 0; overflow: auto; padding: 14px; }
.statusbar { height: var(--statusbar-h); background: var(--surface); border-top: 1px solid var(--border); display: flex; align-items: center; gap: 16px; padding: 0 14px; color: var(--text3); font-family: var(--mono); font-size: 9px; flex: 0 0 auto; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 16px; }
.card-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--surface2); border-bottom: 1px solid var(--border); }
.card-title { font-weight: 700; font-size: 12px; color: var(--text); }
.card-sub { margin-left: auto; color: var(--text2); font-family: var(--mono); font-size: 10px; }
.card-body { padding: 14px 16px; }
.section-title { font-size: 18px; font-weight: 700; margin: 0 0 14px; display: flex; align-items: center; gap: 10px; }
.section-title .sub { color: var(--text2); font-size: 11px; font-family: var(--mono); font-weight: 400; }
.grid { display: grid; gap: 12px; }
.cols1 { grid-template-columns: 1fr; }
.cols2 { grid-template-columns: 1fr 1fr; }
.cols3 { grid-template-columns: 1fr 1fr 1fr; }
.cols4 { grid-template-columns: repeat(4, 1fr); }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
label { font-family: var(--mono); font-size: 9px; color: var(--text2); text-transform: uppercase; letter-spacing: .08em; }
input, textarea, select { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 5px; color: var(--text); padding: 7px 9px; outline: none; }
textarea { min-height: 64px; resize: vertical; line-height: 1.45; }
input:focus, textarea:focus, select:focus { border-color: var(--amber); }
.help { color: var(--text3); font-size: 11px; margin-top: 4px; }
.warnbox, .okbox { padding: 10px 12px; border-radius: 6px; margin-bottom: 14px; font-size: 12px; }
.warnbox { background: var(--red-dim); border: 1px solid rgba(248,81,73,.35); color: var(--red); }
.okbox { background: var(--green-dim); border: 1px solid rgba(63,185,80,.35); color: var(--green); }
.tabs { display: flex; gap: 0; overflow-x: auto; background: var(--surface2); border-bottom: 1px solid var(--border); }
.tab { padding: 9px 13px; white-space: nowrap; color: var(--text2); border-bottom: 2px solid transparent; user-select: none; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--amber); border-bottom-color: var(--amber); }
.action-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; color: var(--text3); font-family: var(--mono); font-size: 9px; text-transform: uppercase; letter-spacing: .08em; padding: 7px 6px; border-bottom: 1px solid var(--border); }
td { padding: 5px 4px; border-bottom: 1px solid var(--surface2); vertical-align: top; }
td input, td select { padding: 5px 6px; font-size: 12px; }
.raw-json { width: 100%; min-height: 580px; font-family: var(--mono); font-size: 11px; line-height: 1.5; }
.code { white-space: pre-wrap; font-family: var(--mono); font-size: 10px; line-height: 1.55; color: var(--text2); }
.preview-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 7px; padding: 11px 12px; margin-bottom: 10px; }
.pp-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.pp-desc { color: var(--text2); font-size: 12px; line-height: 1.5; }
.pp-price { color: var(--amber); font-family: var(--mono); font-size: 14px; margin-top: 6px; }
.pp-head { color: var(--text3); font-family: var(--mono); font-size: 9px; text-transform: uppercase; letter-spacing: .12em; margin: 14px 0 7px; }
.badge { font-family: var(--mono); font-size: 9px; padding: 2px 6px; border-radius: 4px; color: var(--amber); background: var(--amber-dim); border: 1px solid rgba(210,153,34,.35); }
.diff-grid { display: grid; gap: 10px; }
.diff-row { border: 1px solid var(--border); border-radius: 7px; overflow: hidden; background: var(--surface); }
.diff-head { display: flex; gap: 8px; align-items: center; padding: 8px 10px; background: var(--surface2); border-bottom: 1px solid var(--border); font-family: var(--mono); font-size: 10px; color: var(--text2); }
.diff-body { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
.diff-cell { padding: 9px 10px; min-width: 0; border-right: 1px solid var(--border); }
.diff-cell:last-child { border-right: none; }
.diff-label { font-family: var(--mono); font-size: 9px; color: var(--text3); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 5px; }
.diff-value { font-family: var(--mono); font-size: 10px; color: var(--text2); white-space: pre-wrap; word-break: break-word; max-height: 160px; overflow: auto; }
.diff-added { color: var(--green); }
.diff-removed { color: var(--red); }
.diff-changed { color: var(--amber); }
.search-row { display: flex; gap: 8px; margin-bottom: 10px; }
.search-row input { flex: 1; }
.hidden { display: none !important; }
.empty { color: var(--text3); font-style: italic; padding: 8px 0; }
hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
@media (max-width: 1100px) {
  :root { --preview-w: 330px; --nav-w: 180px; }
  .cols3, .cols4 { grid-template-columns: 1fr 1fr; }
}

/* v2.0.2 layout usability */
.topbar { position: sticky; top: 0; z-index: 40; }
.statusbar { position: sticky; bottom: 0; z-index: 40; }
.nav { position: sticky; top: var(--topbar-h); height: calc(100vh - var(--topbar-h) - var(--statusbar-h)); }
.editor { height: calc(100vh - var(--topbar-h) - var(--statusbar-h)); scroll-behavior: smooth; }
.preview { height: calc(100vh - var(--topbar-h) - var(--statusbar-h)); }
.section-title { position: sticky; top: -22px; z-index: 20; background: linear-gradient(var(--bg) 70%, rgba(13,17,23,0)); padding: 0 0 12px; }
.action-row.sticky-actions { position: sticky; top: 24px; z-index: 18; background: var(--bg); padding: 8px 0; border-bottom: 1px solid var(--border); }
.tabs.sticky-tabs { position: sticky; top: 70px; z-index: 17; }
details.card { display: block; }
details.card > summary.card-head { list-style: none; cursor: pointer; }
details.card > summary.card-head::-webkit-details-marker { display: none; }
details.card > summary.card-head::before { content: "▸"; color: var(--text3); font-family: var(--mono); font-size: 11px; transition: transform .12s; }
details.card[open] > summary.card-head::before { transform: rotate(90deg); }
details.card:not([open]) { margin-bottom: 10px; }
details.card:not([open]) > summary.card-head { border-bottom: none; }
.head-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.card-head .head-actions + .card-sub { margin-left: 0; }
.table-scroll { overflow-x: auto; max-width: 100%; border: 1px solid var(--border); border-radius: 6px; }
.table-scroll table { margin-bottom: 0; min-width: 940px; }
.compact-note { color: var(--text2); font-family: var(--mono); font-size: 10px; }
.package-summary { display: grid; grid-template-columns: repeat(4, minmax(120px, 1fr)); gap: 10px; margin-bottom: 12px; }
.summary-tile { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 9px 10px; }
.summary-label { color: var(--text3); font-family: var(--mono); font-size: 9px; text-transform: uppercase; letter-spacing: .08em; }
.summary-value { color: var(--text); font-size: 13px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.raw-json { height: calc(100vh - var(--topbar-h) - var(--statusbar-h) - 170px); min-height: 520px; overflow: auto; }
.code { max-height: calc(100vh - var(--topbar-h) - var(--statusbar-h) - 95px); overflow: auto; }
.preview-card { overflow-wrap: anywhere; }
@media (max-width: 1120px) {
  :root { --preview-w: 330px; --nav-w: 190px; }
  .cols3, .cols4 { grid-template-columns: 1fr 1fr; }
  .package-summary { grid-template-columns: 1fr 1fr; }
}


/* v2.0.3 resizable and collapsible panels */
.splitter {
  width: 7px;
  flex: 0 0 7px;
  background: var(--bg);
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
  cursor: col-resize;
  position: relative;
  z-index: 25;
}
.splitter::after {
  content: "";
  position: absolute;
  top: 50%;
  left: 2px;
  width: 2px;
  height: 44px;
  border-left: 1px solid var(--border2);
  border-right: 1px solid var(--border2);
  transform: translateY(-50%);
  opacity: .7;
}
.splitter:hover, .splitter.dragging { background: var(--surface2); }
.splitter:hover::after, .splitter.dragging::after { border-color: var(--amber); opacity: 1; }
body.resizing { user-select: none; cursor: col-resize; }
body.nav-collapsed { --nav-w: 48px; }
body.nav-collapsed .nav { overflow-x: hidden; }
body.nav-collapsed .nav-label { opacity: 0; height: 10px; padding: 7px 0 0; overflow: hidden; }
body.nav-collapsed .nav-item { white-space: nowrap; gap: 18px; padding-left: 14px; }
body.nav-collapsed .nav-badge { display: none; }
body.preview-collapsed .preview,
body.preview-collapsed #previewSplitter { display: none; }
.preview-restore-tab {
  display: none;
  position: fixed;
  right: 0;
  top: 50%;
  transform: translateY(-50%) rotate(-90deg);
  transform-origin: right bottom;
  z-index: 80;
  background: var(--blue-dim);
  color: var(--blue);
  border: 1px solid rgba(68,147,248,.45);
  border-radius: 6px 6px 0 0;
  padding: 6px 12px;
  font-size: 11px;
}
body.preview-collapsed .preview-restore-tab { display: block; }
body.nav-collapsed #toggleNavBtn,
body.preview-collapsed #togglePreviewBtn { color: var(--amber); border-color: rgba(210,153,34,.55); background: var(--amber-dim); }
.nav, .preview { transition: width .12s ease; }
body.resizing .nav, body.resizing .preview { transition: none; }
@media (max-width: 1120px) {
  .splitter { width: 6px; flex-basis: 6px; }
}

/* v2.0.4 package actions and collapsible JSON windows */
.json-window {
  max-height: 340px;
  overflow: auto;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 12px;
  font-family: var(--mono);
  font-size: 10px;
  line-height: 1.55;
  color: var(--text2);
  white-space: pre-wrap;
  word-break: break-word;
}
.raw-json-wrap .card-body { padding: 0; }
.raw-json-wrap textarea.raw-json {
  border: none;
  border-radius: 0;
  min-height: calc(100vh - 250px);
  resize: vertical;
}
.package-action-help {
  color: var(--text3);
  font-size: 11px;
  margin-top: -4px;
  margin-bottom: 10px;
}
.package-action-row {
  align-items: center;
}

</style>
</head>
<body>
  <div class="topbar">
    <div class="logo">PRICING EDITOR</div>
    <div class="file-pill"><span id="dirtyDot" class="dot"></span><span id="fileName">No file loaded</span></div>
    <button class="btn blue" id="openBtn">Open JSON</button>
    <input type="file" id="fileInput" accept="application/json,.json" class="hidden" />
    <button class="btn" id="discardBtn">Discard</button>
    <button class="btn green" id="validateBtn">Validate</button>
    <button class="btn primary" id="saveBtn">Save Copy</button>
    <button class="btn" id="downloadBtn">Download JSON</button>
    <button class="btn" id="toggleNavBtn" title="Collapse or expand left navigation">☰ Nav</button>
    <button class="btn" id="togglePreviewBtn" title="Collapse or expand right preview">▣ Preview</button>
    <button class="btn" id="resetLayoutBtn" title="Reset panel widths">Reset Layout</button>
    <div class="spacer"></div>
    <div id="validationPill" class="validation-pill">No validation yet</div>
  </div>

  <div class="main">
    <nav id="leftNav" class="nav">
      <div class="nav-label">Sections</div>
      <div class="nav-item active" data-section="metadata"><span class="nav-icon">⊞</span> Metadata</div>
      <div class="nav-item" data-section="contracts"><span class="nav-icon">◑</span> Contract Terms</div>
      <div class="nav-item" data-section="packages"><span class="nav-icon">◈</span> Packages <span id="pkgBadge" class="nav-badge">0</span></div>
      <div class="nav-item" data-section="options"><span class="nav-icon">◇</span> Option Items</div>
      <div class="nav-item" data-section="custom"><span class="nav-icon">⊙</span> Custom Attrs</div>
      <div class="nav-divider"></div>
      <div class="nav-label">Tools</div>
      <div class="nav-item" data-section="save"><span class="nav-icon">▣</span> Save / Export</div>
      <div class="nav-item" data-section="validation"><span class="nav-icon">✓</span> Validation</div>
      <div class="nav-item" data-section="compare"><span class="nav-icon">⊡</span> Compare Versions</div>
      <div class="nav-item" data-section="raw"><span class="nav-icon">⌥</span> Raw JSON</div>
    </nav>

    <div id="navSplitter" class="splitter" title="Drag to resize left nav. Double click to reset."></div>

    <main id="editor" class="editor"></main>

    <div id="previewSplitter" class="splitter" title="Drag to resize right preview. Double click to reset."></div>

    <aside id="previewPanel" class="preview">
      <div class="preview-tabs">
        <div class="preview-tab active" data-preview="pricing">Pricing Preview</div>
        <div class="preview-tab" data-preview="json">JSON</div>
      </div>
      <div id="previewBody" class="preview-body"></div>
    </aside>
    <button id="previewRestoreTab" class="preview-restore-tab" title="Reopen preview">Preview</button>
  </div>

  <div class="statusbar">
    <span id="statusFile">file: none</span>
    <span id="statusDirty">saved</span>
    <span id="statusValidation">validation: not run</span>
    <span id="statusPath">path: blank</span>
  </div>

<script>
const APP_VERSION = "v2.0.4";
let originalData = null;
let data = null;
let currentSection = "metadata";
let currentPreview = "pricing";
let currentFileName = "No file loaded";
let currentFilePath = "";
let dirty = false;
let validationErrors = [];
let validationRan = false;
let activePackageIndex = 0;
let activePackageMode = "details";
let browserFileHandle = null;
let lastSaveMessage = "No save or download yet.";

const editor = document.getElementById("editor");
const previewBody = document.getElementById("previewBody");
const fileInput = document.getElementById("fileInput");

const layoutDefaults = { navWidth: 205, previewWidth: 390, navCollapsed: false, previewCollapsed: false };
let layoutState = { ...layoutDefaults };

function clampNumber(value, min, max) {
  const n = Number(value);
  if (Number.isNaN(n)) return min;
  return Math.max(min, Math.min(max, n));
}
function loadLayoutState() {
  try {
    const saved = JSON.parse(localStorage.getItem("pricingEditorLayoutV203") || "{}");
    layoutState = { ...layoutDefaults, ...saved };
  } catch (_) {
    layoutState = { ...layoutDefaults };
  }
  layoutState.navWidth = clampNumber(layoutState.navWidth, 48, 380);
  layoutState.previewWidth = clampNumber(layoutState.previewWidth, 260, 760);
}
function saveLayoutState() {
  localStorage.setItem("pricingEditorLayoutV203", JSON.stringify(layoutState));
}
function applyLayoutState() {
  document.documentElement.style.setProperty("--nav-w", `${layoutState.navCollapsed ? 48 : layoutState.navWidth}px`);
  document.documentElement.style.setProperty("--preview-w", `${layoutState.previewWidth}px`);
  document.body.classList.toggle("nav-collapsed", !!layoutState.navCollapsed);
  document.body.classList.toggle("preview-collapsed", !!layoutState.previewCollapsed);
  const navBtn = document.getElementById("toggleNavBtn");
  const previewBtn = document.getElementById("togglePreviewBtn");
  if (navBtn) navBtn.textContent = layoutState.navCollapsed ? "☰ Open" : "☰ Nav";
  if (previewBtn) previewBtn.textContent = layoutState.previewCollapsed ? "▣ Open" : "▣ Preview";
}
function resetLayoutState() {
  layoutState = { ...layoutDefaults };
  saveLayoutState();
  applyLayoutState();
}
function setupPanelResizing() {
  loadLayoutState();
  applyLayoutState();

  const mainEl = document.querySelector(".main");
  const navSplitter = document.getElementById("navSplitter");
  const previewSplitter = document.getElementById("previewSplitter");
  const navBtn = document.getElementById("toggleNavBtn");
  const previewBtn = document.getElementById("togglePreviewBtn");
  const resetBtn = document.getElementById("resetLayoutBtn");
  const restoreTab = document.getElementById("previewRestoreTab");

  function startDrag(splitter, mode, event) {
    event.preventDefault();
    document.body.classList.add("resizing");
    splitter.classList.add("dragging");

    function onMove(e) {
      const rect = mainEl.getBoundingClientRect();
      if (mode === "nav") {
        layoutState.navCollapsed = false;
        layoutState.navWidth = clampNumber(e.clientX - rect.left, 140, 380);
      } else {
        layoutState.previewCollapsed = false;
        layoutState.previewWidth = clampNumber(rect.right - e.clientX, 260, 760);
      }
      applyLayoutState();
    }
    function onUp() {
      document.body.classList.remove("resizing");
      splitter.classList.remove("dragging");
      saveLayoutState();
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
    }
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
  }

  navSplitter.addEventListener("mousedown", e => startDrag(navSplitter, "nav", e));
  previewSplitter.addEventListener("mousedown", e => startDrag(previewSplitter, "preview", e));
  navSplitter.addEventListener("dblclick", resetLayoutState);
  previewSplitter.addEventListener("dblclick", resetLayoutState);

  navBtn.onclick = () => {
    layoutState.navCollapsed = !layoutState.navCollapsed;
    saveLayoutState();
    applyLayoutState();
  };
  previewBtn.onclick = () => {
    layoutState.previewCollapsed = !layoutState.previewCollapsed;
    saveLayoutState();
    applyLayoutState();
  };
  restoreTab.onclick = () => {
    layoutState.previewCollapsed = false;
    saveLayoutState();
    applyLayoutState();
  };
  resetBtn.onclick = resetLayoutState;
}


function clone(obj) { return JSON.parse(JSON.stringify(obj)); }
function esc(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")

function field(path, label, type = "text", opts = {}) {
  const current = byPath(path);

  }

    const options = opts.options || [];
    return `<div class="field"><label>${esc(label)}</label><select data-path="${esc(path)}">${options.map(o => `<option value="${esc(o.value)}" ${String(value) === String(o.value) ? "selected" : ""}>${esc(o.label)}</option>`).join("")}</select></div>`;

function bindPathInputs(root = editor) {

      const current = byPath(el.dataset.path);

function getIndexPath(path) {

function setIndexPath(path, value) {

    ? `<div class="card"><div class="card-body empty">Validation has not run for the current edit.</div></div>`

      ? `<div class="warnbox">${validationErrors.length} issue(s) found.</div><div class="card"><div class="card-body">${validationErrors.map(e => `<div style="margin-bottom:8px">• ${esc(e)}</div>`).join("")}</div></div>`
      : `<div class="okbox">Validation passed.</div>`;

function shouldSkipDiffPath(path) {
  return path.split(".").some(part => part === "discountItems");
}
function flattenForDiff(value, prefix = "", out = {}) {
  if (shouldSkipDiffPath(prefix)) return out;
  if (value === null || typeof value !== "object") {
    out[prefix || "root"] = value;
    return out;
  }
  if (Array.isArray(value)) {
    if (!value.length) out[prefix || "root"] = [];
    value.forEach((item, idx) => flattenForDiff(item, prefix ? `${prefix}.${idx}` : String(idx), out));
    return out;
  }
  const keys = Object.keys(value);
  if (!keys.length) out[prefix || "root"] = {};
  keys.forEach(key => flattenForDiff(value[key], prefix ? `${prefix}.${key}` : key, out));
  return out;
}
function compactValue(value) {
  const raw = typeof value === "string" ? value : JSON.stringify(value);
  const text = raw === undefined ? "" : String(raw);
  return text.length > 500 ? text.slice(0, 500) + "…" : text;
}
function buildDiffRows(filterText = "") {
  if (!originalData || !data) return [];
  const before = flattenForDiff(originalData);
  const after = flattenForDiff(data);
  const keys = Array.from(new Set([...Object.keys(before), ...Object.keys(after)])).sort();
  const needle = filterText.trim().toLowerCase();
  return keys
    .filter(key => JSON.stringify(before[key]) !== JSON.stringify(after[key]))
    .filter(key => !needle || key.toLowerCase().includes(needle) || compactValue(before[key]).toLowerCase().includes(needle) || compactValue(after[key]).toLowerCase().includes(needle))
    .map(key => ({ key, before: before[key], after: after[key], type: !(key in before) ? "added" : !(key in after) ? "removed" : "changed" }));
}
function renderCompare() {
  const query = sessionStorage.getItem("compareFilter") || "";
  const rows = buildDiffRows(query);
  editor.innerHTML = `<div class="section-title">Compare Versions <span class="sub">original vs current, discountItems hidden</span></div>
    <div class="search-row"><input id="compareSearch" value="${esc(query)}" placeholder="Filter by path or value" /><button class="btn" id="clearCompareSearch">Clear</button></div>
    ${rows.length ? `<div class="help" style="margin-bottom:10px">${rows.length} changed field(s).</div><div class="diff-grid">${rows.map(row => `<div class="diff-row"><div class="diff-head"><span class="diff-${row.type}">${esc(row.type.toUpperCase())}</span><span>${esc(row.key)}</span></div><div class="diff-body"><div class="diff-cell"><div class="diff-label">Original</div><div class="diff-value">${esc(compactValue(row.before))}</div></div><div class="diff-cell"><div class="diff-label">Current</div><div class="diff-value">${esc(compactValue(row.after))}</div></div></div></div>`).join("")}</div>` : `<div class="okbox">No differences found against the opened file.</div>`}`;
  document.getElementById("compareSearch").addEventListener("input", e => { sessionStorage.setItem("compareFilter", e.target.value); renderCompare(); });
  document.getElementById("clearCompareSearch").onclick = () => { sessionStorage.removeItem("compareFilter"); renderCompare(); };
}
function renderRawJson() {

  editor.innerHTML = `<div class="section-title">Raw JSON <span class="sub">advanced editor</span></div>${stickyActions(`<button class="btn green" id="applyRaw">Apply Raw JSON</button><button class="btn" id="resetRaw">Reset</button><button class="btn blue" id="copyRawJson">Copy JSON</button>`)}${collapsibleCard("Raw JSON Editor", rawEditor, {sub: "editable", open: true, bodyClass: "raw-json-wrap"})}`;

  document.getElementById("copyRawJson").onclick = () => copyCurrentJson();
}

function renderPreview() {
  if (!data) { previewBody.innerHTML = `<div class="empty">No JSON loaded.</div>`; return; }

  }

  html += `<div class="pp-head">Packages</div>`;
  html += packages.length ? packages.map(p => `<div class="preview-card"><div class="pp-title">${esc(p.name || p.internalName || "Package")}</div><div class="pp-desc">${esc(truncate(p.tagline || p.marketingTitle || p.shortDescription || "", 120))}</div><div class="pp-price">${esc(money(p.amount))}${p.unit ? `<span style="color:var(--text2);font-size:11px">/${esc(p.unit)}</span>` : ""}</div><div class="help">${(p.monthlyVolumes || []).length} volume band(s), ${(p.optionItems || []).length} option group(s)</div></div>`).join("") : `<div class="empty">No packages.</div>`;
  const terms = data.contractTerms?.contractInitialTerm || [];
  if (terms.length) html += `<div class="pp-head">Contract Terms</div><div class="preview-card">${terms.map(t => `<span class="badge" style="margin-right:6px">${esc((t.termValue ?? "") + " " + (t.termUnit ?? ""))}${Number(t.isDefault || 0) === 1 ? " default" : ""}</span>`).join("")}</div>`;
  const groups = data.optionItems || [];
  if (groups.length) html += `<div class="pp-head">Option Items</div>${groups.map(g => `<div class="preview-card"><div class="pp-title">${esc(g.optionItemType || "Group")}</div><div class="pp-desc">${(g.optionLineItems || []).length} line item(s)</div></div>`).join("")}`;
  previewBody.innerHTML = html;

  const pill = document.getElementById("validationPill");

    pill.textContent = "No file loaded";

    document.getElementById("statusValidation").textContent = "validation: not run";

    pill.textContent = validationErrors.length + " validation issue(s)";
    pill.className = "validation-pill warn";
    document.getElementById("statusValidation").textContent = "validation: " + validationErrors.length + " issue(s)";
  } else {
    pill.textContent = "Ready";
    pill.className = "validation-pill";
    document.getElementById("statusValidation").textContent = "validation: ready";
  }
}
function normalizeSort(arr) { arr.forEach((x, i) => { if (x && typeof x === "object") x.sortOrder = i; }); }
function defaultContractTerm(sortOrder) { return {termValue: 1, termUnit: "Y", description: "", isDefault: 0, sortOrder, discountItems: []}; }
function defaultMonthlyVolume(sortOrder) { return {internalName: "New Monthly Volume", minimumValue: 1, maximumValue: 1000, amount: 0, amountDescription: "", transactionUnitAmount: 0, unit: "month", subCount: 0, subUnitType: "transactions", subUnit: "month", subUnitDescription: "", isDefault: 0, sortOrder, termAmounts: [], discountItems: []}; }
function defaultOptionGroup() { return {optionItemType: "New Group", headerDescription: "", toolTipText: "", toolTipDescription: "", headerDescription2: "", toolTipText2: "", toolTipDescription2: "", customAttributes: [], discountItems: [], optionLineItems: []}; }
function defaultLineItem() { return {catalogCode: "", internalName: "New Option", marketingTitle: "", tagline: "", toolTipDescription: "", shortDescription: "", longDescription: "", amount: 0, amountDescription: "", useTransactionUnitAmount: 0, unit: "", subCount: 0, subUnitType: "", subUnit: "", subUnitDescription: "", isIncluded: 0, isDefault: 0, isCountable: 0, countableMin: 0, countableMax: 0, sortOrder: 0, customAttributes: [], discountItems: [], termAmounts: []}; }
function defaultPackage() { return {internalName: "New Package", name: "New Package", marketingTitle: "", tagline: "", toolTipDescription: "", shortDescription: "", longDescription: "", amount: 0, amountDescription: "", unit: "month", subCount: 0, subUnitType: "", subUnit: "", subUnitDescription: "", isDefault: 0, isCountable: 0, countableMin: 0, countableMax: 0, sortOrder: 0, includedModuleText: "", customAttributes: [], productItems: [], monthlyVolumes: [], discountItems: [], optionItems: []}; }

async function openFile() {
  if (window.showOpenFilePicker) {
    try {
      const [handle] = await window.showOpenFilePicker({types: [{description: "JSON", accept: {"application/json": [".json"]}}]});
      browserFileHandle = handle;
      const file = await handle.getFile();
      const text = await file.text();
      loadJson(text, file.name);
      return;
    } catch (err) {
      if (err.name === "AbortError") return;
    }
  }
  fileInput.click();
}
function loadJson(text, name) {
  try {
    data = JSON.parse(text);
    originalData = clone(data);
    currentFileName = name || "loaded.json";
    currentFilePath = currentFilePath || currentFileName;
    dirty = false;
    validationErrors = [];
    validationRan = false;
    activePackageIndex = 0;
    render();
  } catch (err) {
    alert("Could not parse JSON: " + err.message);
  }
}
async function validateData() {
  if (!data) return alert("Open a JSON file first.");
  try {
    const res = await fetch("/validate", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({data})});
    const json = await res.json();
    validationErrors = json.errors || [];
    validationRan = true;
    updateShell();
    if (currentSection === "validation") renderValidation();
    alert(json.valid ? "Validation passed." : `Validation found ${validationErrors.length} issue(s).`);
  } catch (err) {
    alert("Validation request failed: " + err.message);
  }
}
function shouldWarnBeforeSave() {
  if (!validationRan) return confirm("Validation has not been run for the latest edits. Save anyway?");
  if (validationErrors.length) return confirm(`Validation has ${validationErrors.length} issue(s). Save anyway?`);
  return true;
}
async function saveVersion() {
  if (!data) return alert("Open a JSON file first.");
  if (!shouldWarnBeforeSave()) return;
  if (!currentFilePath || currentFilePath === currentFileName || !currentFilePath.toLowerCase().endsWith(".json")) {
    currentFilePath = prompt("Enter the full source JSON path. The backend will save a versioned copy in the same folder:", currentFilePath || currentFileName) || "";
    if (!currentFilePath) return;
  }
  try {
    const res = await fetch("/save", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({path: currentFilePath, data})});
    const json = await res.json();
    if (!res.ok) throw new Error(json.detail || "Save failed");
    lastSaveMessage = `Saved backend copy: ${json.saved_as}`;
    markSaved(true);
    if (currentSection === "save") renderSaveExport();
    alert("Saved as " + json.saved_as);
  } catch (err) {
    lastSaveMessage = "Backend save failed: " + err.message;
    updateShell();
    if (currentSection === "save") renderSaveExport();
    alert("Save failed: " + err.message);
  }
}
function downloadJson() {
  if (!data) return alert("Open a JSON file first.");
  if (!shouldWarnBeforeSave()) return;
  const base = (currentFileName || "pricing.json").replace(/\.json$/i, "");
  const stamp = new Date().toISOString().replace(/[-:]/g, "").slice(0, 15).replace("T", "_");
  const name = `${base}_v2_0_1_${stamp}.json`;
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
  lastSaveMessage = `Downloaded browser copy: ${name}`;
  markSaved(true);
  if (currentSection === "save") renderSaveExport();
}
function discardChanges() {
  if (!originalData) return;
  if (dirty && !confirm("Discard unsaved changes?")) return;
  data = clone(originalData);
  dirty = false;
  validationErrors = [];
  validationRan = false;
  render();
}

fileInput.addEventListener("change", async e => {
  const file = e.target.files[0];
  if (!file) return;
  const text = await file.text();
  browserFileHandle = null;
  loadJson(text, file.name);
});
document.getElementById("openBtn").onclick = openFile;
document.getElementById("discardBtn").onclick = discardChanges;
document.getElementById("validateBtn").onclick = validateData;
document.getElementById("saveBtn").onclick = saveVersion;
document.getElementById("downloadBtn").onclick = downloadJson;
document.querySelectorAll(".nav-item[data-section]").forEach(item => item.onclick = () => {
  document.querySelectorAll(".nav-item").forEach(x => x.classList.remove("active"));
  item.classList.add("active");
  currentSection = item.dataset.section;
  render();
});
document.querySelectorAll(".preview-tab").forEach(tab => tab.onclick = () => {
  document.querySelectorAll(".preview-tab").forEach(x => x.classList.remove("active"));
  tab.classList.add("active");
  currentPreview = tab.dataset.preview;
  renderPreview();
});

setupPanelResizing();
ensureLoaded();
updateShell();
