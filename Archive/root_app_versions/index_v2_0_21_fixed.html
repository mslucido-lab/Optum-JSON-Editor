/* v2.0.3 resizable and collapsible panels */
.splitter {
  width: 7px;
  flex: 0 0 7px;
  background: var(--bg);
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
  cursor: col-resize;
  position: relative;
  z-index: 25;
}
.splitter::after {
  content: "";
  position: absolute;
  top: 50%;
  left: 2px;
  width: 2px;
  height: 44px;
  border-left: 1px solid var(--border2);
  border-right: 1px solid var(--border2);
  transform: translateY(-50%);
  opacity: .7;
}
.splitter:hover, .splitter.dragging { background: var(--surface2); }
.splitter:hover::after, .splitter.dragging::after { border-color: var(--amber); opacity: 1; }
body.resizing { user-select: none; cursor: col-resize; }
body.nav-collapsed { --nav-w: 48px; }

body.nav-collapsed .nav-item { white-space: nowrap; gap: 18px; padding-left: 14px; }

body.preview-collapsed .preview,
body.preview-collapsed #previewSplitter { display: none; }
body.editor-collapsed .editor,
body.editor-collapsed #previewSplitter { display: none; }
body.editor-collapsed .preview { flex: 1 1 auto; width: auto; }
.preview-restore-tab {
  display: none;

  right: 0;
  top: 50%;
  transform: translateY(-50%) rotate(-90deg);
  transform-origin: right bottom;
  z-index: 80;

  color: var(--blue);
  border: 1px solid rgba(68,147,248,.45);

}

.nav, .editor, .preview { transition: width .12s ease, flex-basis .12s ease; }
body.resizing .nav, body.resizing .editor, body.resizing .preview { transition: none; }

  .splitter { width: 6px; flex-basis: 6px; }

<script>
const APP_VERSION = "v2.0.21";
const APP_VERSION_JS = "v2_0_21";
let originalData = null;
let data = null;
let currentSection = "metadata";
let currentPreview = "pricing";
let currentFileName = "No file loaded";
let currentFilePath = "";
let dirty = false;
let validationErrors = [];
let validationIssues = [];
let validationFilter = "";
let validationRan = false;
let activePackageIndex = 0;
let activePackageMode = "details";
let browserFileHandle = null;
let lastSaveMessage = "No save or download yet.";
let saveHistory = loadSaveHistory();
let metadataCollapsed = localStorage.getItem("pricingEditorMetadataCollapsedV205") === "true";

const editor = document.getElementById("editor");
const previewBody = document.getElementById("previewBody");
const fileInput = document.getElementById("fileInput");

const layoutDefaults = { navWidth: 205, previewWidth: 390, navCollapsed: false, editorCollapsed: false, previewCollapsed: false };
let layoutState = { ...layoutDefaults };

function clampNumber(value, min, max) {
  const n = Number(value);
  if (Number.isNaN(n)) return min;
  return Math.max(min, Math.min(max, n));
}
function loadLayoutState() {
  try {
    const saved = JSON.parse(localStorage.getItem("pricingEditorLayoutV203") || "{}");
    layoutState = { ...layoutDefaults, ...saved };
  } catch (_) {
    layoutState = { ...layoutDefaults };
  }
  layoutState.navWidth = clampNumber(layoutState.navWidth, 48, 380);
  layoutState.previewWidth = clampNumber(layoutState.previewWidth, 260, 1400);
}
function saveLayoutState() {
  localStorage.setItem("pricingEditorLayoutV203", JSON.stringify(layoutState));
}
function applyLayoutState() {
  document.documentElement.style.setProperty("--nav-w", `${layoutState.navCollapsed ? 48 : layoutState.navWidth}px`);
  document.documentElement.style.setProperty("--preview-w", `${layoutState.previewWidth}px`);
  document.body.classList.toggle("nav-collapsed", !!layoutState.navCollapsed);
  document.body.classList.toggle("editor-collapsed", !!layoutState.editorCollapsed);
  document.body.classList.toggle("preview-collapsed", !!layoutState.previewCollapsed);
  const navBtn = document.getElementById("toggleNavBtn");
  const editorBtn = document.getElementById("toggleEditorBtn");
  const previewBtn = document.getElementById("togglePreviewBtn");
  if (navBtn) navBtn.textContent = layoutState.navCollapsed ? "☰ Open" : "☰ Nav";
  if (editorBtn) editorBtn.textContent = layoutState.editorCollapsed ? "▤ Open" : "▤ Editor";
  if (previewBtn) previewBtn.textContent = layoutState.previewCollapsed ? "▣ Open" : "▣ Preview";
}
function resetLayoutState() {
  layoutState = { ...layoutDefaults };
  saveLayoutState();
  applyLayoutState();
}
function setupPanelResizing() {
  loadLayoutState();
  applyLayoutState();

  const mainEl = document.querySelector(".main");
  const navSplitter = document.getElementById("navSplitter");
  const previewSplitter = document.getElementById("previewSplitter");
  const navBtn = document.getElementById("toggleNavBtn");
  const editorBtn = document.getElementById("toggleEditorBtn");
  const previewBtn = document.getElementById("togglePreviewBtn");
  const resetBtn = document.getElementById("resetLayoutBtn");
  const restoreTab = document.getElementById("previewRestoreTab");

  function startDrag(splitter, mode, event) {
    event.preventDefault();
    document.body.classList.add("resizing");
    splitter.classList.add("dragging");

    function onMove(e) {
      const rect = mainEl.getBoundingClientRect();
      if (mode === "nav") {
        layoutState.navCollapsed = false;
        layoutState.navWidth = clampNumber(e.clientX - rect.left, 140, 380);
      } else {
        layoutState.editorCollapsed = false;
        layoutState.previewCollapsed = false;
        const navVisibleWidth = layoutState.navCollapsed ? 48 : layoutState.navWidth;
        const maxPreviewWidth = Math.max(260, rect.width - navVisibleWidth - 300);
        layoutState.previewWidth = clampNumber(rect.right - e.clientX, 260, maxPreviewWidth);
      }
      applyLayoutState();
    }
    function onUp() {
      document.body.classList.remove("resizing");
      splitter.classList.remove("dragging");
      saveLayoutState();
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
    }
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
  }

  navSplitter.addEventListener("mousedown", e => startDrag(navSplitter, "nav", e));
  previewSplitter.addEventListener("mousedown", e => startDrag(previewSplitter, "preview", e));
  navSplitter.addEventListener("dblclick", resetLayoutState);
  previewSplitter.addEventListener("dblclick", resetLayoutState);

  navBtn.onclick = () => {
    layoutState.navCollapsed = !layoutState.navCollapsed;
    saveLayoutState();
    applyLayoutState();
  };
  editorBtn.onclick = () => {
    layoutState.editorCollapsed = !layoutState.editorCollapsed;
    if (layoutState.editorCollapsed) {
      layoutState.previewCollapsed = false;
    }
    saveLayoutState();
    applyLayoutState();
  };
  previewBtn.onclick = () => {
    layoutState.previewCollapsed = !layoutState.previewCollapsed;
    if (layoutState.previewCollapsed && layoutState.editorCollapsed) {
      layoutState.editorCollapsed = false;
    }
    saveLayoutState();
    applyLayoutState();
  };
  restoreTab.onclick = () => {
    layoutState.previewCollapsed = false;
    saveLayoutState();
    applyLayoutState();
  };
  resetBtn.onclick = resetLayoutState;
}


function clone(obj) { return JSON.parse(JSON.stringify(obj)); }
function esc(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}
function money(value) {
  if (value === null || value === undefined || value === "") return "";

function analyzeVolumeBands(volumes) {
  const byIndex = {};
  const summary = [];
  const addIssue = (idx, text, type = "warn") => {
    byIndex[idx] = byIndex[idx] || [];
    byIndex[idx].push({text, type});
  };
  const rows = (volumes || []).map((mv, idx) => {
    const minRaw = mv.minimumValue;
    const maxRaw = mv.maximumValue;
    const min = minRaw === "" || minRaw === null || minRaw === undefined ? null : Number(minRaw);
    const max = maxRaw === "" || maxRaw === null || maxRaw === undefined ? null : Number(maxRaw);
    if (min === null || Number.isNaN(min)) addIssue(idx, "Missing min", "error");
    if (max === null || Number.isNaN(max)) addIssue(idx, "Missing max", "error");
    if (min !== null && max !== null && !Number.isNaN(min) && !Number.isNaN(max) && min > max) addIssue(idx, "Min > max", "error");
    return {idx, min, max};
  }).filter(r => r.min !== null && r.max !== null && !Number.isNaN(r.min) && !Number.isNaN(r.max));
  rows.sort((a, b) => a.min - b.min || a.max - b.max);
  for (let i = 1; i < rows.length; i++) {
    const prev = rows[i - 1];
    const cur = rows[i];
    if (cur.min <= prev.max) {
      addIssue(cur.idx, `Overlap with band ${prev.idx + 1}`, "error");
      addIssue(prev.idx, `Overlap with band ${cur.idx + 1}`, "error");
    } else if (cur.min > prev.max + 1) {
      addIssue(cur.idx, `Gap after band ${prev.idx + 1}`, "warn");
      addIssue(prev.idx, `Gap before band ${cur.idx + 1}`, "warn");
    }
  }
  const errorCount = Object.values(byIndex).flat().filter(x => x.type === "error").length;
  const warnCount = Object.values(byIndex).flat().filter(x => x.type !== "error").length;
  if (errorCount) summary.push({text: `${errorCount} range error(s)`, type: "error"});
  if (warnCount) summary.push({text: `${warnCount} range warning(s)`, type: "warn"});
  return {byIndex, summary};
}

function shouldSkipDiffPath(path) {
  return path.split(".").some(part => part === "discountItems");
}
function flattenForDiff(value, prefix = "", out = {}) {
  if (shouldSkipDiffPath(prefix)) return out;
  if (value === null || typeof value !== "object") {
    out[prefix || "root"] = value;
    return out;
  }
  if (Array.isArray(value)) {
    if (!value.length) out[prefix || "root"] = [];
    value.forEach((item, idx) => flattenForDiff(item, prefix ? `${prefix}.${idx}` : String(idx), out));
    return out;
  }
  const keys = Object.keys(value);
  if (!keys.length) out[prefix || "root"] = {};
  keys.forEach(key => flattenForDiff(value[key], prefix ? `${prefix}.${key}` : key, out));
  return out;
}
function compactValue(value) {

}

  if (path.startsWith("packages")) return {group: "Packages", section: "packages"};
  if (path.startsWith("optionItems")) return {group: "Option Items", section: "options"};
  if (path.startsWith("customAttributes")) return {group: "Custom Attributes", section: "custom"};
  return {group: "Metadata", section: "metadata"};
}

  const match = path.match(/^packages\.(\d+)/);

}
function packageModeFromDiffPath(path) {
  if (path.includes(".monthlyVolumes")) return "volumes";
  if (path.includes(".optionItems")) return "options";
  return "details";
}

}
function buildDiffRows(filterText = "") {
  if (!originalData || !data) return [];
  const before = flattenForDiff(originalData);
  const after = flattenForDiff(data);
  const keys = Array.from(new Set([...Object.keys(before), ...Object.keys(after)])).sort();
  const needle = filterText.trim().toLowerCase();
  const ignoreSort = sessionStorage.getItem("compareIgnoreSortOrder") === "true";
  const ignoreEmpty = sessionStorage.getItem("compareIgnoreEmpty") === "true";
  return keys
    .filter(key => JSON.stringify(before[key]) !== JSON.stringify(after[key]))
    .filter(key => !(ignoreSort && key.split(".").pop() === "sortOrder"))
    .filter(key => !(ignoreEmpty && (isEmptyishDiffValue(before[key]) || isEmptyishDiffValue(after[key]))))
    .filter(key => !needle || key.toLowerCase().includes(needle) || compactValue(before[key]).toLowerCase().includes(needle) || compactValue(after[key]).toLowerCase().includes(needle))
    .map(key => {
      const meta = compareSectionForPath(key);
      return { key, before: before[key], after: after[key], type: !(key in before) ? "added" : !(key in after) ? "removed" : "changed", group: meta.group, section: meta.section, packageIndex: packageIndexFromDiffPath(key), packageMode: packageModeFromDiffPath(key) };
    });
}
function groupDiffRows(rows) {

    acc[row.group].push(row);

function addValidationIssue(list, severity, group, section, path, message, extra = {}) {
  list.push({severity, group, section, path, message, ...extra});
}
function issueText(issue) {
  return `${issue.group}: ${issue.message}${issue.path ? ` (${issue.path})` : ""}`;
}
function isBlankValue(value) {
  return value === null || value === undefined || String(value).trim() === "";
}
function duplicateValues(values) {
  const seen = new Map();
  const dupes = new Set();
  values.forEach(v => {
    const key = String(v ?? "").trim().toLowerCase();
    if (!key) return;
    if (seen.has(key)) dupes.add(key);
    seen.set(key, true);
  });
  return dupes;
}
function duplicateSortIssues(list, group, section, basePath, issues, extra = {}) {
  const seen = new Map();
  (list || []).forEach((item, idx) => {
    const sort = item?.sortOrder;
    if (sort === null || sort === undefined || sort === "") return;
    const key = String(sort);
    if (seen.has(key)) {
      addValidationIssue(issues, "warning", group, section, `${basePath}.${idx}.sortOrder`, `Duplicate sortOrder ${key}.`, extra);
      addValidationIssue(issues, "warning", group, section, `${basePath}.${seen.get(key)}.sortOrder`, `Duplicate sortOrder ${key}.`, extra);
    } else {
      seen.set(key, idx);
    }
  });
}
function runFrontendValidation(apply = true) {
  const issues = [];
  if (!data) {
    if (apply) {
      validationIssues = [];
      validationErrors = [];
    }
    return [];
  }

  ["name", "description", "slug"].forEach(key => {
    if (isBlankValue(data[key])) addValidationIssue(issues, "error", "Metadata", "metadata", key, `Missing required metadata field: ${key}.`);
  });

  const initialTerms = data.contractTerms?.contractInitialTerm || [];
  if (Array.isArray(initialTerms) && initialTerms.length) {
    let defaults = 0;
    initialTerms.forEach((term, idx) => {
      if (Number(term.isDefault || 0) === 1) defaults++;
      if (isBlankValue(term.termValue)) addValidationIssue(issues, "error", "Contract Terms", "contracts", `contractTerms.contractInitialTerm.${idx}.termValue`, "Contract term is missing termValue.");
      if (isBlankValue(term.termUnit)) addValidationIssue(issues, "error", "Contract Terms", "contracts", `contractTerms.contractInitialTerm.${idx}.termUnit`, "Contract term is missing termUnit.");
    });
    if (defaults === 0) addValidationIssue(issues, "error", "Contract Terms", "contracts", "contractTerms.contractInitialTerm", "No default initial contract term is selected.");
    if (defaults > 1) addValidationIssue(issues, "error", "Contract Terms", "contracts", "contractTerms.contractInitialTerm", "Multiple default initial contract terms are selected.");
    duplicateSortIssues(initialTerms, "Contract Terms", "contracts", "contractTerms.contractInitialTerm", issues);
  }

  const packages = data.packages || [];
  if (!Array.isArray(packages)) {
    addValidationIssue(issues, "error", "Packages", "packages", "packages", "packages must be an array.");
  } else {
    const dupNames = duplicateValues(packages.map(p => p?.name || p?.internalName || ""));
    let defaultCount = 0;
    packages.forEach((pkg, pIdx) => {
      const pPath = `packages.${pIdx}`;
      const extra = {packageIndex: pIdx};
      if (Number(pkg.isDefault || 0) === 1) defaultCount++;
      if (isBlankValue(pkg.name) && isBlankValue(pkg.internalName)) addValidationIssue(issues, "error", "Packages", "packages", `${pPath}.name`, `Package ${pIdx + 1} is missing a name.`, extra);
      const nameKey = String(pkg.name || pkg.internalName || "").trim().toLowerCase();
      if (nameKey && dupNames.has(nameKey)) addValidationIssue(issues, "warning", "Packages", "packages", `${pPath}.name`, `Duplicate package name: ${pkg.name || pkg.internalName}.`, extra);

      const volumes = pkg.monthlyVolumes || [];
      duplicateSortIssues(volumes, "Monthly Volume Bands", "packages", `${pPath}.monthlyVolumes`, issues, {...extra, packageMode: "volumes"});
      const analysis = analyzeVolumeBands(volumes);
      Object.entries(analysis.byIndex || {}).forEach(([idx, bandIssues]) => {
        bandIssues.forEach(item => addValidationIssue(
          issues,
          item.type === "error" ? "error" : "warning",
          "Monthly Volume Bands",
          "packages",
          `${pPath}.monthlyVolumes.${idx}`,
          `Package ${pIdx + 1}, band ${Number(idx) + 1}: ${item.text}.`,
          {...extra, packageMode: "volumes"}
        ));
      });

      const pkgGroups = pkg.optionItems || [];
      duplicateSortIssues(pkgGroups, "Option Items", "packages", `${pPath}.optionItems`, issues, {...extra, packageMode: "pkgOptions"});
      pkgGroups.forEach((group, gIdx) => validateOptionGroup(group, `packages.${pIdx}.optionItems.${gIdx}`, issues, "Package Option Items", "packages", {...extra, packageMode: "pkgOptions"}));
    });
    if (packages.length && defaultCount === 0) addValidationIssue(issues, "warning", "Packages", "packages", "packages", "No default package is selected.");
    if (defaultCount > 1) addValidationIssue(issues, "error", "Packages", "packages", "packages", "Multiple default packages are selected.");
    duplicateSortIssues(packages, "Packages", "packages", "packages", issues);
  }

  (data.optionItems || []).forEach((group, gIdx) => validateOptionGroup(group, `optionItems.${gIdx}`, issues, "Option Items", "options", {}));
  duplicateSortIssues(data.optionItems || [], "Option Items", "options", "optionItems", issues);

  (data.customAttributes || []).forEach((attr, idx) => {
    if (isBlankValue(attr.name)) addValidationIssue(issues, "warning", "Custom Attributes", "custom", `customAttributes.${idx}.name`, `Custom attribute ${idx + 1} is missing a name.`);
  });
  duplicateSortIssues(data.customAttributes || [], "Custom Attributes", "custom", "customAttributes", issues);

  if (apply) {
    validationIssues = issues;
    validationErrors = issues.map(issueText);
  }
  return issues;
}
function validateOptionGroup(group, basePath, issues, groupLabel, section, extra = {}) {
  if (isBlankValue(group?.optionItemType)) addValidationIssue(issues, "warning", groupLabel, section, `${basePath}.optionItemType`, "Option group is missing optionItemType.", extra);
  const lines = group?.optionLineItems || [];
  duplicateSortIssues(lines, groupLabel, section, `${basePath}.optionLineItems`, issues, extra);
  lines.forEach((line, liIdx) => {
    const linePath = `${basePath}.optionLineItems.${liIdx}`;
    const hasName = !isBlankValue(line.internalName) || !isBlankValue(line.marketingTitle) || !isBlankValue(line.shortDescription);
    if (!hasName) addValidationIssue(issues, "error", groupLabel, section, `${linePath}.internalName`, `Line item ${liIdx + 1} is missing a name.`, extra);
    const looksBillable = !isBlankValue(line.unit) || !isBlankValue(line.amountDescription) || Number(line.useTransactionUnitAmount || 0) === 1;
    if (looksBillable && isBlankValue(line.amount)) addValidationIssue(issues, "warning", groupLabel, section, `${linePath}.amount`, `Line item ${liIdx + 1} looks billable but amount is blank.`, extra);
  });
}
function filterValidationIssues(issues, filterText) {
  const needle = String(filterText || "").trim().toLowerCase();
  if (!needle) return issues;
  return issues.filter(issue => [issue.group, issue.section, issue.path, issue.message, issue.severity].join(" ").toLowerCase().includes(needle));
}
function groupValidationIssues(issues) {
  return issues.reduce((acc, issue) => {
    acc[issue.group] = acc[issue.group] || [];
    acc[issue.group].push(issue);
    return acc;
  }, {});
}
function updateValidationBadges() {
  const pkgCount = data?.packages?.length || 0;
  const termsCount = (data?.contractTerms?.contractInitialTerm || []).length;
  const optionCount = data?.optionItems?.length || 0;
  const customCount = data?.customAttributes?.length || 0;
  const inventory = {

  if (validationEl) {

  }
}

const previewCheckedPackages = new Set();
let previewOtfOpen = true;
let previewAddonsOpen = false;

function getCustomAttr(d, name) {
  const attrs = (d && d.customAttributes) || [];
  const attr = attrs.find(a => a && String(a.name || '').trim() === name);
  return attr ? (attr.value || '') : '';
}

function previewCategoryLabel(viewTemplate) {
  if (!viewTemplate) return '';
  const t = String(viewTemplate).toLowerCase();
  if (t.includes('api')) return 'Application Programming Interface';
  if (t.includes('software')) return 'Software';
  return viewTemplate;
}

function previewFmt$(n) {
  const v = parseFloat(n);
  if (isNaN(v)) return '$0.00';
  return v === 0 ? '$0.00' : '$' + v.toFixed(2);
}

function previewFmtRange(mv) {
  const min = mv.minimumValue ?? 0;
  const max = mv.maximumValue;
  if (max === null || max === undefined || max === '' || Number(max) >= 999999999) {
    return `${Number(min).toLocaleString()}+ requests per month`;
  }
  return `${Number(min).toLocaleString()} \u2013 ${Number(max).toLocaleString()} requests per month`;
}

function previewFmtPrice(mv) {
  const price = parseFloat(mv.transactionUnitAmount ?? 0);
  const unit = mv.unit || '';
  if (price === 0) return unit || 'Included';
  return `${previewFmt$(price)}/${unit}`;
}

function getTopLevelOptionGroup(d, type) {
  const groups = (d && d.optionItems) || [];
  return groups.find(g => g && String(g.optionItemType || '').trim() === type) || null;
}

function previewAddonLabel(item) {
  return esc(item.marketingTitle || item.internalName || item.shortDescription || 'Add-on');
}

function previewAddonDescription(item) {
  return item.longDescription || item.shortDescription || item.toolTipDescription || '';
}

function previewAddonAmount(item) {
  const amt = parseFloat(item.amount ?? 0);
  const txn = parseFloat(item.transactionUnitAmount ?? 0);
  const amount = amt !== 0 ? amt : txn;
  const unit = item.unit || item.subUnitDescription || item.subUnit || '';
  const money = previewFmt$(amount);
  return `${money}${unit ? `<span class="op-addon-unit">${esc(unit)}</span>` : ''}`;
}

function renderOptumPreview() {
  if (!data) {
    previewBody.innerHTML = `<div class="empty">No JSON loaded.</div>`;
    return;
  }

  const packages = data.packages || [];
  const multi = previewCheckedPackages.size > 1;

  // Monthly total from checked packages
  let monthly = 0;
  previewCheckedPackages.forEach(i => {
    const pkg = packages[i];
    if (pkg && pkg.amount) monthly += parseFloat(pkg.amount) || 0;
  });

  // Option groups
  const implGroup  = getTopLevelOptionGroup(data, 'Implementations');
  const addonGroup = getTopLevelOptionGroup(data, 'Addons');
  const implItem   = implGroup  && implGroup.optionLineItems  && implGroup.optionLineItems[0]  ? implGroup.optionLineItems[0]  : null;
  const implAmt    = implItem   ? (parseFloat(implItem.amount) || 0) : 0;
  const implDisc   = multi ? implAmt : 0;
  const implNet    = implAmt - implDisc;
  const addonCount = addonGroup && addonGroup.optionLineItems ? addonGroup.optionLineItems.length : 0;

  // Discount tooltips from customAttributes
  const discountTooltip = getCustomAttr(data, 'packageMonthlySummaryDiscountToolTip');
  const implWaiverTooltip = getCustomAttr(data, 'implementationSummaryDiscountToolTip');
  const implHeaderHtml = [
    implGroup ? (implGroup.headerDescription || '') : '',
    multi && implWaiverTooltip ? implWaiverTooltip : ''
  ].filter(Boolean).join(' ');

  // Package cards HTML
  const pkgCardsHtml = packages.map((pkg, i) => {
    const sel = previewCheckedPackages.has(i);
    const name = esc(pkg.name || pkg.internalName || 'Package');
    const priceDesc = esc(pkg.amountDescription || '');
    const subtitle = esc(pkg.marketingTitle || '');
    const bands = (pkg.monthlyVolumes || []).map(mv =>
      `<div class="op-tier-row">
        <span class="op-tier-range">${esc(previewFmtRange(mv))}</span>
        <span class="op-tier-dots"></span>
        <span class="op-tier-price">${esc(previewFmtPrice(mv))}</span>
      </div>`
    ).join('');
    return `<div class="op-pkg-card${sel ? ' op-sel' : ''}" data-pkgidx="${i}">
      <div class="op-pkg-cb">
        <svg class="op-pkg-ck" width="9" height="9" viewBox="0 0 10 10" fill="none">
          <path d="M1.5 5l2.5 2.5 4.5-4.5" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="op-pkg-left">
        <div class="op-pkg-name">${name}</div>
        <div class="op-pkg-price">${priceDesc}</div>
        <div class="op-pkg-sub">${subtitle}</div>
      </div>
      <div class="op-pkg-right">${bands}</div>
    </div>`;
  }).join('');

  // Implementation section HTML
  const implHtml = implGroup ? `
    <div class="op-section-divider"></div>
    <div class="op-h2">Implementation</div>
    <div class="op-body-text">${implHeaderHtml}</div>
    <div class="op-section-sublabel" style="margin-bottom:6px">Required with your package</div>
    <div class="op-impl-card">
      <div>
        <div class="op-impl-name">${esc(implItem ? (implItem.internalName || '') : '')}</div>
        <div class="op-impl-desc">${implItem ? (implItem.longDescription || implItem.shortDescription || '') : ''}</div>
      </div>
      <div class="op-impl-price-col">
        ${multi ? `<div class="op-impl-orig">${previewFmt$(implAmt)}</div>` : ''}
        <div class="op-impl-new">${multi ? '$0.00' : previewFmt$(implAmt)}</div>
        <div class="op-impl-unit">${esc(implItem ? (implItem.unit || 'one-time fee') : 'one-time fee')}</div>
      </div>
    </div>` : '';

  // Add-ons section HTML
  const addonItems = addonGroup && Array.isArray(addonGroup.optionLineItems) ? addonGroup.optionLineItems : [];
  const addonItemsHtml = addonItems.map(item => `
    <div class="op-addon-item">
      <div class="op-addon-name">${previewAddonLabel(item)}</div>
      <div class="op-addon-desc">${previewAddonDescription(item)}</div>
      <div class="op-addon-price">${previewAddonAmount(item)}</div>
    </div>
  `).join('');
  const addonHtml = addonGroup ? `
    <div class="op-section-divider"></div>
    <div class="op-h2">Add-ons</div>
    <div class="op-section-sublabel">Add-ons available with your package</div>
    <div class="op-body-text">${addonGroup.headerDescription || ''}</div>
    <div class="op-addon-row${previewAddonsOpen ? ' op-open' : ''}" id="opAddonHead" role="button" tabindex="0" aria-expanded="${previewAddonsOpen ? 'true' : 'false'}">
      <div class="op-addon-row-label">${addonCount} Add-on option${addonCount !== 1 ? 's' : ''}</div>
      <div class="op-addon-expand-btn">
        <svg width="9" height="9" viewBox="0 0 10 10" fill="none">
          <path d="M2 4l3 3 3-3" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
    ${previewAddonsOpen ? `<div class="op-addon-body">${addonItemsHtml || '<div class="op-addon-desc">No add-on line items found.</div>'}</div>` : ''}` : '';

  // Order Summary HTML
  const otfBodyStyle = previewOtfOpen ? 'display:flex;flex-direction:column;gap:3px' : 'display:none';
  const otfArrowStyle = previewOtfOpen ? 'transform:rotate(180deg)' : '';
  const summaryHtml = `
    <div class="op-summary-box">
      <div class="op-summary-title">Order summary</div>
      <div class="op-costs-head">
        <span>Monthly costs</span>
        <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M2 4l3 3 3-3" stroke="#8fa3bb" stroke-width="1.4" stroke-linecap="round"/></svg>
      </div>
      <div class="op-sum-row"><span class="op-sum-lbl">Est. monthly payment:</span><span class="op-sum-val op-big">${previewFmt$(monthly)}</span></div>
      <div style="height:6px"></div>
      <div class="op-sum-row" style="padding-bottom:2px"><span class="op-sum-lbl" style="font-weight:700;color:#f0f4ff;font-size:11px">Selected Add-Ons</span></div>
      <div class="op-sum-row"><span class="op-sum-lbl">Included Add-Ons</span><span class="op-sum-val" style="font-size:10px">Based on Usage*</span></div>
      <div class="op-sum-row"><span class="op-sum-lbl">Your Add-on costs</span><span class="op-sum-val">&mdash;</span></div>
      <div class="op-sum-row"><span class="op-sum-lbl">Monthly subtotal:</span><span class="op-sum-val">${previewFmt$(monthly)}</span></div>
      <div class="op-otf-head" id="opOtfHead">
        <span class="op-otf-title">One-time fees</span>
        <svg id="opOtfArrow" width="11" height="11" viewBox="0 0 11 11" fill="none" style="${otfArrowStyle};transition:transform .2s"><path d="M2 4l3 3 3-3" stroke="#8fa3bb" stroke-width="1.4" stroke-linecap="round"/></svg>
      </div>
      <div id="opOtfBody" style="${otfBodyStyle}">
        <div style="font-size:10px;font-weight:700;color:#8fa3bb;margin-bottom:2px">Selected Implementation</div>
        <div class="op-otf-row"><span class="op-otf-lbl" style="font-size:10px">${esc(implItem ? (implItem.internalName || '') : 'Implementation Fee')}</span></div>
        <div class="op-otf-row"><span class="op-otf-lbl">List price</span><span class="op-otf-val">${previewFmt$(implAmt)}</span></div>
        ${multi ? `<div class="op-otf-row"><span class="op-otf-lbl" style="color:#00b050">100% off discount</span><span class="op-otf-val op-disc">-${previewFmt$(implDisc)}</span></div>` : ''}
        <div class="op-otf-row" style="border-top:1px solid #2a3040;margin-top:3px;padding-top:3px"><span class="op-otf-lbl">Your Implementations costs</span><span class="op-otf-val">${previewFmt$(implNet)}</span></div>
        <div class="op-otf-row"><span class="op-otf-lbl">One-time fees subtotal</span><span class="op-otf-val">$0.00</span></div>
      </div>
      <div class="op-sum-divider"></div>
      <div class="op-promo-row">
        <input placeholder="Enter Promo Code" style="font-size:10px;padding:4px 7px;border-radius:4px;flex:1">
        <button>Apply</button>
      </div>
      <div class="op-sum-row"><span class="op-sum-lbl">Initial payment:</span><span class="op-sum-val op-big">$0.00</span></div>
      <button class="op-checkout-btn">Continue to checkout</button>
      <div class="op-save-link">Save changes</div>
    </div>
    <div class="op-help-box">
      <div class="op-help-title">Need help?</div>
      <a class="op-help-link">You may find what you need in our FAQs</a>
      <div class="op-help-desc">Or contact us for questions about quotes, implementation, or for other help.</div>
      <button class="op-help-btn">Contact us</button>
    </div>`;

  // Build full preview HTML
  previewBody.innerHTML = `
    <div class="op-preview-wrap">
      <div class="op-preview-cols">
        <div class="op-preview-left">
          <div class="op-cat-label">${esc(previewCategoryLabel(data.viewTemplate))}</div>
          <div class="op-h1">${esc(data.name || 'Unnamed Product')}</div>
          <div class="op-h2">Build your package</div>
          <div class="op-body-text">${data.headerDescription || ''}</div>
          <div class="op-notice-text">Pricing shown is for partners only.</div>
          <div class="op-notice-text" style="margin-bottom:8px">If your volume levels are higher, OR you are a provider, <a href="#">contact us</a> to receive a private quote from our sales team.</div>
          ${discountTooltip ? `<div class="op-discount-text">${discountTooltip}</div>` : ''}
          <div id="opPkgCards">${pkgCardsHtml}</div>
          ${implHtml}
          ${addonHtml}
          ${data.paymentSchedule ? `<div class="op-payment-notice">${String(data.paymentSchedule || '')}</div>` : ''}
        </div>
        <div class="op-preview-right">${summaryHtml}</div>
      </div>
    </div>`;

  // Bind package card click handlers
  previewBody.querySelectorAll('.op-pkg-card').forEach(card => {
    card.addEventListener('click', () => {
      const idx = parseInt(card.dataset.pkgidx, 10);
      if (previewCheckedPackages.has(idx)) {
        previewCheckedPackages.delete(idx);
      } else {
        previewCheckedPackages.add(idx);
      }
      renderOptumPreview();
    });
  });

  // Bind Add-ons accordion
  const addonHead = document.getElementById('opAddonHead');
  if (addonHead) {
    const toggleAddons = () => {
      previewAddonsOpen = !previewAddonsOpen;
      renderOptumPreview();
    };
    addonHead.addEventListener('click', toggleAddons);
    addonHead.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        toggleAddons();
      }
    });
  }

  // Bind OTF accordion
  const otfHead = document.getElementById('opOtfHead');
  if (otfHead) {
    otfHead.addEventListener('click', () => {
      previewOtfOpen = !previewOtfOpen;
      renderOptumPreview();
    });
  }
}

function renderPreview() {
  if (currentPreview === "json" && !document.body.classList.contains("preview-mode")) {
    previewBody.innerHTML = `<pre class="code">${esc(JSON.stringify(data, null, 2))}</pre>`;
    return;
  }
  renderOptumPreview();
}

function togglePreviewMode(force) {
  const next = typeof force === "boolean" ? force : !document.body.classList.contains("preview-mode");
  if (next) {
    layoutState.previewCollapsed = false;
    layoutState.editorCollapsed = false;
    saveLayoutState();
    applyLayoutState();
  }
  document.body.classList.toggle("preview-mode", next);
  renderPreview();
}

function updateShell() {
  const pkgCount = data?.packages?.length || 0;
  if (data) runFrontendValidation(true);
  document.getElementById("fileName").textContent = currentFileName;
  document.getElementById("dirtyDot").className = dirty ? "dot dirty" : "dot";
  document.getElementById("pkgBadge").textContent = pkgCount;
  document.getElementById("statusFile").textContent = "file: " + currentFileName;
  document.getElementById("statusDirty").textContent = dirty ? "unsaved" : "saved";
  document.getElementById("statusPath").textContent = "path: " + (currentFilePath || "blank");
  updateValidationBadges();
  const pill = document.getElementById("validationPill");
  const errors = (validationIssues || []).filter(i => i.severity === "error").length;
  const warnings = (validationIssues || []).filter(i => i.severity !== "error").length;
  if (!data) {
    pill.textContent = "No file loaded";
    pill.className = "validation-pill warn";
    document.getElementById("statusValidation").textContent = "validation: not run";
  } else if (errors || warnings) {
    pill.textContent = `${errors} error(s), ${warnings} warning(s)`;
    pill.className = "validation-pill warn";
    document.getElementById("statusValidation").textContent = validationRan ? `validation: ${errors + warnings} issue(s)` : `frontend: ${errors + warnings} issue(s)`;
  } else {
    pill.textContent = validationRan ? "Backend validated" : "Frontend clean";
    pill.className = "validation-pill";
    document.getElementById("statusValidation").textContent = validationRan ? "validation: ready" : "validation: not run";
  }
}
function normalizeSort(arr) { arr.forEach((x, i) => { if (x && typeof x === "object") x.sortOrder = i; }); }
function defaultContractTerm(sortOrder) { return {termValue: 1, termUnit: "Y", description: "", isDefault: 0, sortOrder, discountItems: []}; }
function defaultMonthlyVolume(sortOrder) { return {internalName: "New Monthly Volume", minimumValue: 1, maximumValue: 1000, amount: 0, amountDescription: "", transactionUnitAmount: 0, unit: "month", subCount: 0, subUnitType: "transactions", subUnit: "month", subUnitDescription: "", isDefault: 0, sortOrder, termAmounts: [], discountItems: []}; }
function defaultOptionGroup() { return {optionItemType: "New Group", headerDescription: "", toolTipText: "", toolTipDescription: "", headerDescription2: "", toolTipText2: "", toolTipDescription2: "", customAttributes: [], discountItems: [], optionLineItems: []}; }
function defaultLineItem() { return {catalogCode: "", internalName: "New Option", marketingTitle: "", tagline: "", toolTipDescription: "", shortDescription: "", longDescription: "", amount: 0, amountDescription: "", useTransactionUnitAmount: 0, unit: "", subCount: 0, subUnitType: "", subUnit: "", subUnitDescription: "", isIncluded: 0, isDefault: 0, isCountable: 0, countableMin: 0, countableMax: 0, sortOrder: 0, customAttributes: [], discountItems: [], termAmounts: []}; }
function defaultPackage() { return {internalName: "New Package", name: "New Package", marketingTitle: "", tagline: "", toolTipDescription: "", shortDescription: "", longDescription: "", amount: 0, amountDescription: "", unit: "month", subCount: 0, subUnitType: "", subUnit: "", subUnitDescription: "", isDefault: 0, isCountable: 0, countableMin: 0, countableMax: 0, sortOrder: 0, includedModuleText: "", customAttributes: [], productItems: [], monthlyVolumes: [], discountItems: [], optionItems: []}; }

async function openFile() {
  if (!confirmCanReplaceOpenFile()) return;
  if (window.showOpenFilePicker) {
    try {
      const [handle] = await window.showOpenFilePicker({types: [{description: "JSON", accept: {"application/json": [".json"]}}]});
      browserFileHandle = handle;
      const file = await handle.getFile();
      const text = await file.text();
      loadJson(text, file.name);
      return;
    } catch (err) {
      if (err.name === "AbortError") return;
    }
  }
  fileInput.click();
}
function loadJson(text, name) {
  try {
    data = JSON.parse(text);
    originalData = clone(data);
    currentFileName = name || "loaded.json";
    currentFilePath = recallPathForFile(currentFileName) || currentFileName;
    dirty = false;
    validationErrors = [];
    validationIssues = [];
    validationRan = false;
    activePackageIndex = 0;
    previewCheckedPackages.clear();
    previewAddonsOpen = false;
    runFrontendValidation(true);
    render();
  } catch (err) {
    alert("Could not parse JSON: " + err.message);
  }
}
async function validateData() {
  if (!data) return alert("Open a JSON file first.");
  try {
    const frontendIssues = runFrontendValidation(false);
    const res = await fetch("/validate", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({data})});
    const json = await res.json();
    const backendIssues = (json.errors || []).map((message, idx) => ({severity: "error", group: "Backend", section: "validation", path: `backend.${idx}`, message}));
    validationIssues = [...frontendIssues, ...backendIssues];
    validationErrors = validationIssues.map(issueText);
    validationRan = true;
    updateShell();
    if (currentSection === "validation") renderValidation();
    alert(validationIssues.length ? `Validation found ${validationIssues.length} issue(s).` : "Validation passed.");
  } catch (err) {
    alert("Validation request failed: " + err.message);
  }
}
function shouldWarnBeforeSave() {
  const issues = runFrontendValidation(true);
  const errors = issues.filter(i => i.severity === "error");
  const warnings = issues.filter(i => i.severity !== "error");
  if (errors.length) {
    alert(`Save Copy is blocked because frontend validation has ${errors.length} error(s). Open Validation to review. Fix validation errors before saving.`);
    return false;
  }
  if (!validationRan) return confirm("Backend validation has not been run for the latest edits. Save Copy anyway using frontend checks only?");
  if (warnings.length) return confirm(`Validation has ${warnings.length} warning(s). Save Copy anyway?`);
  return true;
}
async function saveVersion() {
  if (!data) return alert("Open a JSON file first.");
  if (!shouldWarnBeforeSave()) return;
  if (!currentFilePath || currentFilePath === currentFileName || !currentFilePath.toLowerCase().endsWith(".json")) {
    currentFilePath = prompt("Enter the full source JSON path. The backend will save a versioned copy in the same folder:", currentFilePath || currentFileName) || "";
    if (!currentFilePath) return;
  }
  try {
    const res = await fetch("/save", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({path: currentFilePath, data})});
    const json = await res.json();
    if (!res.ok) throw new Error(json.detail || "Save failed");
    lastSaveMessage = `Saved backend copy: ${json.saved_as}`;
    rememberCurrentPath();
    addSaveHistory("Saved copy", json.saved_as, json.path || currentFilePath);
    markSaved(true);
    if (currentSection === "save") renderSaveExport();
    alert("Saved as " + json.saved_as);
  } catch (err) {
    lastSaveMessage = "Backend save failed: " + err.message;
    updateShell();
    if (currentSection === "save") renderSaveExport();
    alert("Save failed: " + err.message);
  }
}
function downloadJson() {
  if (!data) return alert("Open a JSON file first.");
  if (!shouldWarnBeforeSave()) return;
  const base = (currentFileName || "pricing.json").replace(/\.json$/i, "");
  const stamp = new Date().toISOString().replace(/[-:]/g, "").slice(0, 15).replace("T", "_");
  const name = `${base}_${APP_VERSION_JS}_${stamp}.json`;
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
  lastSaveMessage = `Downloaded browser copy: ${name}`;
  addSaveHistory("Downloaded JSON", name, "browser downloads");
  markSaved(true);
  if (currentSection === "save") renderSaveExport();
}
function discardChanges() {
  if (!originalData) return;
  if (dirty && !confirm("Discard unsaved changes?")) return;
  data = clone(originalData);
  dirty = false;
  validationErrors = [];
  validationRan = false;
  render();
}

fileInput.addEventListener("change", async e => {
  if (!confirmCanReplaceOpenFile()) { e.target.value = ""; return; }
  const file = e.target.files[0];
  if (!file) return;
  const text = await file.text();
  browserFileHandle = null;
  loadJson(text, file.name);
});
document.getElementById("openBtn").onclick = openFile;
document.getElementById("discardBtn").onclick = discardChanges;
document.getElementById("validateBtn").onclick = validateData;
document.getElementById("saveBtn").onclick = saveVersion;
document.getElementById("downloadBtn").onclick = downloadJson;
document.getElementById("previewModeBtn").onclick = () => togglePreviewMode();
document.querySelectorAll(".nav-item[data-section]").forEach(item => item.onclick = () => {
  document.querySelectorAll(".nav-item").forEach(x => x.classList.remove("active"));
  item.classList.add("active");
  currentSection = item.dataset.section;
  render();
});
document.querySelectorAll(".preview-tab").forEach(tab => tab.onclick = () => {
  document.querySelectorAll(".preview-tab").forEach(x => x.classList.remove("active"));
  tab.classList.add("active");
  currentPreview = tab.dataset.preview;
  renderPreview();
});

setupPanelResizing();
ensureLoaded();
updateShell();
</script>
</body>
